sources:

  excel_sales:
    file_type: xlsx
    fingerprint_columns:
      - Order Dt
      - Total Paid INR
    date_column: Order Dt
    amount_column: Total Paid INR
    type_column: Txn Kind
    category_column: Random Notes Column

  payment_gateway:
    file_type: csv
    fingerprint_columns:
      - Gateway Fee
      - Status
    date_column: Transaction Date
    amount_column: Amount INR
    type_column: Status
    category_column: Description
    filter:
      column: Status
      keep_value: SUCCESS

  hdfc_bank:
    file_type: csv
    fingerprint_columns:
      - Withdrawal Amt
      - Deposit Amt
    date_column: Txn Date
    debit_column: Withdrawal Amt
    credit_column: Deposit Amt
    category_column: Narration

  axis_bank:
    file_type: txt
    fingerprint_keyword: AXIS BANK
    parse_method: fixed_width
    char_ranges:
      date: [0, 10]
      description: [10, 35]
      debit: [35, 45]
      credit: [45, 60]

  tally:
    file_type: xml
    xml_voucher_tag: VOUCHER
    xml_date_tag: DATE
    xml_narration_tag: NARRATION
    xml_amount_tag: AMOUNT
